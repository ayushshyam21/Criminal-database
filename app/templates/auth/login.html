{% extends "base.html" %}

{% block title %}Sign In - Department Access{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-lg rounded-3">
            <div class="card-header bg-dark text-white text-center py-4 rounded-top-3" style="background-color: #0e2038 !important; border-bottom: 3px solid #c59b27;">
                <i class="bi bi-shield-lock-fill text-warning display-4"></i>
                <h4 class="mt-2 mb-0 fw-bold">CRIME RECORD DBMS</h4>
                <small class="text-white-50">Department of Police & Crime Analytics</small>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username / Badge ID</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g. admin_sys" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Credential Key</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="background-color: #1b3a63; border-color: #1b3a63;">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate & Enter
                    </button>
                </form>

                <!-- Quick-Fill for Evaluator / Demo -->
                <div class="mt-4 pt-3 border-top">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <small class="text-muted fw-bold"><i class="bi bi-lightning-charge-fill text-warning"></i> DEMO QUICK-FILL CREDENTIALS</small>
                    </div>
                    <div class="btn-group w-100" role="group">
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="quickFill('admin_sys', 'DemoPass123!')">
                            Admin
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="quickFill('officer_carter', 'DemoPass123!')">
                            Officer
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="quickFill('investigator_chen', 'DemoPass123!')">
                            Investigator
                        </button>
                    </div>
                    <small class="d-block text-muted text-center mt-2" style="font-size: 0.75rem;">
                        Default password for all seeded demonstration accounts is <code>DemoPass123!</code>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function quickFill(user, pass) {
    document.getElementById('username').value = user;
    document.getElementById('password').value = pass;
}
</script>
{% endblock %}
