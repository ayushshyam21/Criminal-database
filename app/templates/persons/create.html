{% extends "base.html" %}

{% block title %}Register Persona - Crime Record DBMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="d-flex align-items-center mb-3">
            <a href="{{ url_for('persons.list_persons') }}" class="btn btn-outline-secondary btn-sm me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h3 class="fw-bold mb-0 text-dark">Register Fictional Persona</h3>
                <small class="text-muted">Create synthetic demonstration subject (enforces <code>is_fictional = TRUE</code>)</small>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('persons.create_person') }}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="first_name" class="form-label fw-semibold">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="first_name" name="first_name" placeholder="e.g. John" required>
                        </div>
                        <div class="col-md-6">
                            <label for="last_name" class="form-label fw-semibold">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="last_name" name="last_name" placeholder="e.g. Doe" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="date_of_birth" class="form-label fw-semibold">Date of Birth</label>
                            <input type="date" class="form-control" id="date_of_birth" name="date_of_birth">
                        </div>
                        <div class="col-md-6">
                            <label for="gender" class="form-label fw-semibold">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="Unknown" selected>Unknown</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Non-Binary">Non-Binary</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="phone_contact" class="form-label fw-semibold">Phone Contact</label>
                        <input type="text" class="form-control" id="phone_contact" name="phone_contact" placeholder="312-555-0199">
                    </div>

                    <div class="mb-4">
                        <label for="address_line" class="form-label fw-semibold">Fictional Address</label>
                        <input type="text" class="form-control" id="address_line" name="address_line" placeholder="e.g. 1234 Fictional Ave, Chicago, IL">
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('persons.list_persons') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-person-check me-1"></i> Save Persona
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
